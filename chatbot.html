<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진로 챗봇 · 탐색하고 싶은 직업 찾기</title>
<style>
:root{--navy:#14213d;--navy2:#1f3a68;--yel:#f4c430;--yel-soft:#fff6d6;--red:#e53935;--ink:#1d2433;--muted:#667085;--line:#dbe3ef;--bg:#f3f6fb;--blue-soft:#e8eefb;--green:#2e9d5b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
button{font-family:inherit;cursor:pointer}
.app{max-width:820px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 0 1px var(--line)}
header{background:linear-gradient(110deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#f57c00 0 16.6%,#f4c430 16.6% 33.3%,#2e9d5b 33.3% 50%,#1e88e5 50% 66.6%,#283593 66.6% 83.3%,#8e44ad 83.3%)}
.logo{width:42px;height:42px;border-radius:50%;background:var(--yel);display:grid;place-items:center;font-size:22px;flex:none}
header h1{margin:0;font-size:19px;letter-spacing:-.3px}
header h1 b{color:var(--yel)}
header p{margin:2px 0 0;font-size:12.5px;color:#cfdaf5}
.hbtn{margin-left:auto;display:flex;gap:6px}
.hbtn button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 11px;font-size:12.5px}
.hbtn .hl{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 11px;font-size:12.5px;text-decoration:none;display:inline-flex;align-items:center}
.hbtn .hl[hidden]{display:none}
.hbtn button:hover{background:rgba(255,255,255,.22)}
#chat{flex:1;overflow-y:auto;padding:18px 14px 8px;scroll-behavior:smooth}
.row{display:flex;gap:8px;margin:0 0 12px;align-items:flex-start}
.row.me{justify-content:flex-end}
.av{width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--yel);display:grid;place-items:center;font-size:16px;flex:none}
.bub{max-width:86%;padding:11px 14px;border-radius:16px;line-height:1.6;white-space:pre-wrap;word-break:keep-all}
.bot .bub{background:var(--blue-soft);border-top-left-radius:4px}
.me .bub{background:var(--yel);border-top-right-radius:4px;font-weight:600}
.bub b.k{color:var(--navy2)}
.bub .red{color:var(--red);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 2px;white-space:normal}
.chip{border:1.5px solid #b9c7e6;background:#fff;color:var(--navy2);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;line-height:1.3;text-align:left}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.chip:hover{border-color:var(--navy2)}
.chip.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.chip.on small{color:#dbe4ff}
.chip.go{background:var(--yel);border-color:#e0b21c;color:var(--navy)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip:disabled{opacity:.45;cursor:default}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0 4px;white-space:normal}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;position:relative}
.card.gold{border:2px solid var(--yel);background:var(--yel-soft)}
.card h4{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:6px}
.card .rk{width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--yel);font-size:12px;display:grid;place-items:center;flex:none}
.card .pct{margin-left:auto;font-size:12.5px;color:var(--green);font-weight:800}
.bar{height:6px;border-radius:9px;background:#edf1f7;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yel),#f57c00)}
.card p{margin:4px 0;font-size:13px;color:#3b4459;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
.tag{font-size:11.5px;border-radius:6px;padding:2px 6px;background:#eef2fa;color:var(--navy2)}
.tag.g{background:#fff0b3;color:#7a5a00;font-weight:700}
.tag.m{background:#e3f4ea;color:#1e7046}
.cbtn{display:flex;gap:6px;margin-top:8px}
.cbtn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 4px;font-size:12.5px;font-weight:600;color:var(--navy2)}
.cbtn button.pick{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.cbtn button.picked{background:var(--yel);color:var(--navy);border-color:#e0b21c}
.detail{background:#fff;border-radius:12px;border:1px solid var(--line);padding:12px 14px;margin-top:8px;white-space:normal}
.detail h3{margin:0 0 6px;font-size:17px}
.detail dl{display:grid;grid-template-columns:76px 1fr;gap:5px 8px;margin:0;font-size:13.5px}
.detail dt{color:var(--muted);font-weight:700}
.detail dd{margin:0}
.detail a{color:var(--navy2);font-weight:700}
footer{border-top:1px solid var(--line);padding:10px;background:#fff}
.picks{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12.5px;flex-wrap:wrap}
.picks .lb{font-weight:800;color:var(--navy)}
.pk{border-radius:999px;padding:4px 10px;background:#f1f4f9;color:var(--muted);border:1px dashed #c6d1e3}
.pk.on{background:var(--yel-soft);color:var(--navy);border:1px solid #e9cf72;font-weight:700}
.pk b{margin-right:3px}
.pk .x{margin-left:4px;color:#a0a8b8;cursor:pointer}
.inrow{display:flex;gap:8px}
#msg{flex:1;border:1.5px solid #c9d4e6;border-radius:12px;padding:11px 13px;font-size:15px;font-family:inherit;outline:none}
#msg:focus{border-color:var(--navy2)}
#send{background:var(--navy2);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700;font-size:15px}
.note{font-size:11.5px;color:var(--muted);margin-top:6px;text-align:center}
.sum{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:14px;margin-top:8px;white-space:normal}
.sum h3{margin:0 0 8px;font-size:17px;color:var(--navy)}
.sum table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
.sum th,.sum td{border:1px solid #cfd8e6;padding:6px 8px;text-align:left;vertical-align:top}
.sum th{background:#eef2fa;width:120px;color:var(--navy)}
.sum .rank th{background:var(--yel);text-align:center;width:auto}
.sum .rank td{text-align:center;font-weight:700;height:38px}
.final{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.final label{font-weight:800;color:var(--navy)}
.final select,.final textarea{font-family:inherit;font-size:14px;border:1.5px solid #c9d4e6;border-radius:10px;padding:7px 9px}
.final textarea{width:100%;min-height:58px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13.5px;background:var(--navy2);color:#fff}
.acts button.y{background:var(--yel);color:var(--navy)}
.acts button.w{background:#fff;color:var(--navy2);border:1.5px solid #b9c7e6}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
#printArea{display:none}
@media (max-width:560px){header h1{font-size:16px}header p{display:none}.hbtn button{padding:5px 8px;font-size:11.5px}.bub{max-width:92%}}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .app{display:none}
  #printArea{display:block;font-size:12.5pt;color:#111}
  #printArea h1{font-size:18pt;margin:0 0 4px;color:var(--navy)}
  #printArea .sub{color:#555;margin-bottom:12px}
  #printArea table{width:100%;border-collapse:collapse;margin:8px 0 14px}
  #printArea th,#printArea td{border:1px solid #999;padding:7px 9px;text-align:left;vertical-align:top}
  #printArea th{background:#eef2fa;width:30%}
  #printArea h2{font-size:13.5pt;margin:14px 0 4px;color:var(--navy2)}
  #printArea .rank th{text-align:center;background:#f4c430;width:auto}
  #printArea .rank td{text-align:center;font-weight:700;height:34px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🧭</div>
    <div>
      <h1>진로 챗봇 · <b>탐색하고 싶은 직업</b> 찾기</h1>
      <p>진로심리검사 결과를 입력하면 나에게 맞는 직업을 함께 찾아요</p>
    </div>
    <div class="hbtn"><a id="bHome" class="hl" href="./" hidden>🏠 홈</a><a id="bDl" class="hl" href="chatbot.html" download="진로챗봇_탐색하고싶은직업.html" hidden>📥 내려받기</a><button id="bSum">📋 결과 정리</button><button id="bReset">↺ 처음부터</button></div>
  </header>
  <div id="chat"></div>
  <footer>
    <div class="picks" id="picks"></div>
    <div class="inrow">
      <input id="msg" placeholder="궁금한 직업이나 관심 분야를 입력해 보세요 (예: 동물, 컴퓨터, 디자인)" autocomplete="off">
      <button id="send">보내기</button>
    </div>
    <div class="note">인터넷 없이도 작동해요 · 입력한 내용은 이 컴퓨터(브라우저)에만 저장돼요</div>
  </footer>
</div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>

const JOBS=JOB_SRC.trim().split("\n").map(l=>{const [name,code,ab,va,desc,major,kw]=l.split("|");return {name,code,ab:ab.split(","),va:va.split(","),desc,major,kw:kw.split(",")};});
const KEY="jobbot_v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").replace(/[\s·.,()\-_/]/g,"").toLowerCase();
function blank(){return {step:"grade",grade:"",t1:"",t2:"",intJobs:[],abil:[],low:"",aptJobs:[],vals:[],valJobs:[],picks:[],final:"",reason:"",shown:0,log:[]};}
let S=blank();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&v.step)S=Object.assign(blank(),v);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800);}
const chat=$("chat");
function scroll(){setTimeout(()=>{chat.scrollTop=chat.scrollHeight;},30);}
function addMe(t,log=true){const r=document.createElement("div");r.className="row me";r.innerHTML=`<div class="bub">${esc(t)}</div>`;chat.appendChild(r);if(log){S.log.push(["me",t]);}scroll();}
function addBot(html,extra){const r=document.createElement("div");r.className="row bot";r.innerHTML=`<div class="av">🧭</div><div class="bub">${html}</div>`;const b=r.querySelector(".bub");if(extra)b.appendChild(extra);chat.appendChild(r);scroll();return b;}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function chipRow(items,onPick){const w=el("div","chips");items.forEach(it=>{const b=el("button","chip"+(it.cls?" "+it.cls:""),esc(it.label)+(it.sub?`<small>${esc(it.sub)}</small>`:""));b.onclick=()=>{w.querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add("on");onPick(it);};w.appendChild(b);});return w;}
function multiRow(items,max,onDone,doneLabel){const w=el("div","chips");const sel=new Set();const done=el("button","chip go","✔ "+(doneLabel||"다 골랐어요"));
  items.forEach(it=>{const b=el("button","chip",esc(it.label));b.onclick=()=>{if(sel.has(it.key)){sel.delete(it.key);b.classList.remove("on");}else{if(sel.size>=max){toast(`${max}개까지 고를 수 있어요`);return;}sel.add(it.key);b.classList.add("on");}const order=[...sel];w.querySelectorAll(".chip:not(.go)").forEach(x=>{const k=x.dataset.k;const i=order.indexOf(k);x.innerHTML=esc(items.find(z=>z.key===k).label)+(i>=0?` <b>${i+1}</b>`:"");});};b.dataset.k=it.key;w.appendChild(b);});
  done.onclick=()=>{if(!sel.size){toast("하나 이상 골라 주세요");return;}w.querySelectorAll("button").forEach(x=>x.disabled=true);onDone([...sel]);};w.appendChild(done);return w;}
function splitJobs(t){return String(t||"").split(/[,，、\/\n]|그리고|및/).map(x=>x.trim()).filter(x=>x&&x.length<=20&&!/^(없|모르|건너)/.test(x));}

/* ---------- 질문 흐름 ---------- */
let waitText=null; // 글자 입력을 기다리는 단계
function ask(step){

      chipRow([{label:"건너뛰기",cls:"ghost"}],()=>{waitText=null;addMe("건너뛸게요");S.intJobs=[];ask("abil");}));

      multiRow(Object.entries(ABIL).map(([k,v])=>({label:v,key:k})),3,keys=>{S.abil=keys;addMe("높은 적성: "+keys.map(k=>ABIL[k]).join(", "));ask("low");}));

/* ---------- 점수 계산 ---------- */
function myJobs(){const all=[...S.intJobs.map(x=>[x,"흥미"]),...S.aptJobs.map(x=>[x,"적성"]),...S.valJobs.map(x=>[x,"가치관"])];const m=new Map();
  all.forEach(([n,src])=>{const k=norm(n);if(!k)return;const e=m.get(k)||{name:n,src:new Set()};e.src.add(src);m.set(k,e);});return [...m.values()];}
function same(a,b){const x=norm(a),y=norm(b);if(!x||!y)return false;if(x===y)return true;const [sh,lg]=x.length<=y.length?[x,y]:[y,x];return sh.length>=3&&lg.includes(sh);}
function score(j){
  let s=0,why=[];
  if(S.t1){if(j.code[0]===S.t1){s+=30;why.push(TYPES[S.t1][0]);}else if(j.code.includes(S.t1)){s+=22;why.push(TYPES[S.t1][0]);}}
  if(S.t2&&j.code.includes(S.t2)){s+=j.code[0]===S.t2?16:13;why.push(TYPES[S.t2][0]);}
  const ab=S.abil.filter(a=>j.ab.includes(a));s+=ab.length*10;
  if(S.low&&j.ab.includes(S.low))s-=6;
  const va=S.vals.filter(v=>j.va.includes(v));s+=va.length*8;
  const src=new Set();myJobs().forEach(m=>{if(same(m.name,j.name))m.src.forEach(x=>src.add(x));});
  if(src.size)s+=12+src.size*4;
  const max=30+16+30+16;
  return {job:j,score:s,pct:Math.max(5,Math.min(99,Math.round(s/max*100))),types:why,ab,va,src:[...src],gold:src.size>=2||(src.size>=1&&why.length>=1&&ab.length>=2&&va.length>=1)};
}
function ranked(){return JOBS.map(score).sort((a,b)=>b.score-a.score);}

function cardsBox(list,start){const w=el("div","cards");list.forEach((r,i)=>w.appendChild(card(r,start!=null?start+i:null)));return w;}

  <dt>중요한 가치</dt><dd>${j.va.map(v=>(S.vals.includes(v)?"<b>":"")+VALS[v]+(S.vals.includes(v)?" ✔</b>":"")).join(", ")}</dd>

  const items=[{label:S.picks.includes(j.name)?"⭐ 이미 담았어요":"⭐ 탐색할 직업에 담기",act:"pick"}].concat(sim.map(x=>({label:"비슷한 직업: "+x.job.name,act:"job",job:x.job}))).concat([{label:"추천 더 보기",act:"more",cls:"ghost"}]);

const FIELDS=["동물","자연","컴퓨터","AI","게임","디자인","그림","음악","방송","운동","의료","교육","여행","요리","기계","과학","법","돈","글쓰기","패션","안전","봉사"];
function fieldChips(){addBot("어떤 분야가 궁금한가요?",chipRow(FIELDS.map(f=>({label:f})),it=>{addMe(it.label);search(it.label);}));}
function search(q){
  const words=q.split(/\s+/).map(norm).filter(w=>w.length>=1);
  const exact=JOBS.find(j=>norm(j.name)===norm(q))||JOBS.find(j=>norm(q).length>=2&&(norm(j.name).includes(norm(q))||norm(q).includes(norm(j.name))));
  if(exact){detail(exact);return true;}
  const typeHit=Object.entries(TYPES).find(([k,v])=>words.some(w=>norm(v[0])===w||norm(v[0]).replace("형","")===w));
  const abHit=Object.entries(ABIL).find(([k,v])=>words.some(w=>w.length>=2&&norm(v).includes(w)));
  const vaHit=Object.entries(VALS).find(([k,v])=>words.some(w=>w.length>=2&&norm(v).includes(w)));
  let hits=JOBS.filter(j=>words.some(w=>w.length>=1&&(j.kw.some(k=>norm(k)===w||(w.length>=2&&norm(k).includes(w)))||(w.length>=2&&(norm(j.desc).includes(w)||norm(j.major).includes(w))))));
  let label="";
  if(!hits.length&&typeHit){hits=JOBS.filter(j=>j.code.includes(typeHit[0]));label=typeHit[1][0];}
  if(!hits.length&&abHit){hits=JOBS.filter(j=>j.ab.includes(abHit[0]));label=abHit[1];}
  if(!hits.length&&vaHit){hits=JOBS.filter(j=>j.va.includes(vaHit[0]));label=vaHit[1];}
  if(!hits.length)return false;
  const R=hits.map(score).sort((a,b)=>b.score-a.score).slice(0,6);
  addBot(`'${esc(label||q)}' 관련 직업 중 나와 잘 맞는 순서로 보여 줄게요.`,cardsBox(R,null));
  return true;
}

   <select id="fSel"><option value="">— 고르기 —</option>${opts.map(o=>`<option ${S.final===o?"selected":""}>${esc(o)}</option>`).join("")}</select>
   <textarea id="fWhy" placeholder="이 직업을 고른 이유 (예: 흥미·적성·가치관이 모두 겹치는 황금 지점이라서)">${esc(S.reason)}</textarea></div>
  <div class="acts"><button class="y" id="aPrint">🖨️ 인쇄·PDF로 저장</button><button id="aTxt">💾 텍스트 파일로 저장</button><button class="w" id="aCopy">📋 복사하기</button></div>`;
  addBot(S.picks.length?"지금까지의 결과를 정리했어요. 활동지의 <b>탐색할 직업</b>과 <b>최종 탐색하고 싶은 직업</b> 칸에 옮겨 적어 보세요.":"아직 담은 직업이 없어요. 추천 카드에서 <b>⭐ 담기</b>를 누르면 1·2·3순위에 들어가요.",box);
  box.querySelector("#fSel").onchange=e=>{S.final=e.target.value;save();};
  box.querySelector("#fWhy").oninput=e=>{S.reason=e.target.value;save();};
  box.querySelector("#aPrint").onclick=()=>{buildPrint();window.print();};
  box.querySelector("#aTxt").onclick=()=>{const blob=new Blob(["﻿"+plain()],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`진로챗봇_결과_${new Date().toISOString().slice(0,10)}.txt`;document.body.appendChild(a);a.click();a.remove();toast("파일을 저장했어요");};
  box.querySelector("#aCopy").onclick=()=>copyText(plain(),"결과를 복사했어요");
}
function plain(){
  const R=ranked().slice(0,5);
  return `[나의 진로 보물지도 - 진로 챗봇 결과]
학년: ${S.grade||"-"}
01 직업흥미검사(H): 1순위 ${S.t1?TYPES[S.t1][0]:"-"}, 2순위 ${S.t2?TYPES[S.t2][0]:"-"} / 관심 직업: ${S.intJobs.join(", ")||"-"}
02 직업적성검사: 높은 적성 ${S.abil.map(a=>ABIL[a]).join(", ")||"-"} / 가장 낮은 능력 ${S.low?ABIL[S.low]:"-"} / 관심 직업: ${S.aptJobs.join(", ")||"-"}
03 직업가치관검사: 상위 가치 ${S.vals.map(v=>VALS[v]).join(", ")||"-"} / 관심 직업: ${S.valJobs.join(", ")||"-"}
챗봇 추천 직업: ${R.map(r=>`${r.job.name}(${r.pct}%)`).join(", ")}
탐색할 직업: 1순위 ${S.picks[0]||"-"} / 2순위 ${S.picks[1]||"-"} / 3순위 ${S.picks[2]||"-"}
★ 최종 탐색하고 싶은 직업: ${S.final||"-"}
고른 이유: ${S.reason||"-"}`;
}
function buildPrint(){
  const R=ranked().slice(0,5);
  $("printArea").innerHTML=`<h1>나의 진로 보물지도 · 진로 챗봇 결과</h1><div class="sub">${esc(S.grade||"")} · ${new Date().toLocaleDateString("ko-KR")}　　반 ____ 번 ____ 이름 __________</div>
  <h2>진로심리검사 결과</h2><table>
  <tr><th>01 직업흥미검사(H)</th><td>1순위 ${S.t1?TYPES[S.t1][0]:"-"}, 2순위 ${S.t2?TYPES[S.t2][0]:"-"}<br>관심 직업: ${esc(S.intJobs.join(", ")||"-")}</td></tr>
  <tr><th>02 직업적성검사</th><td>높은 적성: ${S.abil.map(a=>ABIL[a]).join(", ")||"-"}<br>가장 낮은 능력: ${S.low?ABIL[S.low]:"-"}<br>관심 직업: ${esc(S.aptJobs.join(", ")||"-")}</td></tr>
  <tr><th>03 직업가치관검사</th><td>상위 가치: ${S.vals.map(v=>VALS[v]).join(", ")||"-"}<br>관심 직업: ${esc(S.valJobs.join(", ")||"-")}</td></tr></table>
  <h2>진로 챗봇 추천 직업</h2><table>${R.map((r,i)=>`<tr><th>${i+1}. ${esc(r.job.name)} (${r.pct}%)</th><td>${esc(r.job.desc)}<br><small>관련 학과: ${esc(r.job.major)}</small></td></tr>`).join("")}</table>
  <h2>탐색할 직업</h2><table class="rank"><tr><th>① 1순위</th><th>② 2순위</th><th>③ 3순위</th></tr><tr>${[0,1,2].map(i=>`<td>${esc(S.picks[i]||"")}</td>`).join("")}</tr></table>
  <h2>★ 최종 탐색하고 싶은 직업</h2><table><tr><th>직업</th><td style="height:34px"><b>${esc(S.final||"")}</b></td></tr><tr><th>고른 이유</th><td style="height:70px">${esc(S.reason||"")}</td></tr></table>`;
}
function copyText(t,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>fallback());else fallback();
  function fallback(){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("복사하지 못했어요. 직접 선택해 복사해 주세요");}ta.remove();}
}
function promptCopy(){
  const t=`진로 챗봇님, 안녕하세요. 저는 중학교 ${S.grade||"__학년"} 학생으로, 진로 수업 시간에 진로심리검사 3가지를 했습니다.
01 직업흥미검사(H): 일반 흥미 유형으로는 1순위 ${S.t1?TYPES[S.t1][0]:"____"}, 2순위는 ${S.t2?TYPES[S.t2][0]:"____"}이 가장 높게 나왔고, 관심 직업으로는 ${S.intJobs.join(", ")||"____"}입니다.
02 직업적성검사: 높은 적성으로 나온 능력 3가지는 ${S.abil.map(a=>ABIL[a]).join(", ")||"____"}이고, 가장 낮게 나온 능력은 ${S.low?ABIL[S.low]:"____"}입니다. 관심 직업은 ${S.aptJobs.join(", ")||"____"}입니다.
03 직업가치관검사: 상위 직업가치관으로는 ${S.vals.map(v=>VALS[v]).join(", ")||"____"}입니다. 관심 직업은 ${S.valJobs.join(", ")||"____"}입니다.
진로 챗봇님, 저의 직업흥미검사(H), 직업적성검사, 직업가치관검사 결과에 가장 알맞은 직업을 추천해 주세요.`;
  const box=el("div","detail",`<div style="white-space:pre-wrap;font-size:13.5px;line-height:1.6">${esc(t)}</div><div class="acts"><button>📋 질문 복사하기</button></div>`);
  box.querySelector("button").onclick=()=>copyText(t,"질문을 복사했어요");
  addBot("선생님이 안내한 AI 진로 챗봇에 붙여넣을 수 있게 활동지 문장으로 정리했어요.",box);
}

/* ---------- 입력 ---------- */
function onSend(){
  const t=$("msg").value.trim();if(!t)return;$("msg").value="";
  addMe(t);
  if(waitText){const k=waitText;waitText=null;S[k]=splitJobs(t);save();
    const nx={intJobs:"abil",aptJobs:"vals",valJobs:"result"}[k];
    if(!S[k].length)addBot("직업 이름을 찾지 못했어요. 다음 단계로 넘어갈게요.");
    ask(nx);return;}
  if(S.step!=="chat"){addBot("먼저 위의 질문에 답해 주세요. 버튼을 누르면 돼요! 🙂");return;}
  if(/처음|다시 시작|리셋/.test(t)){reset();return;}
  if(/결과|정리|요약/.test(t)){summary();return;}
  if(/더\s*(보|추천)|다른\s*직업|추천/.test(t)){moreRecs();return;}
  if(/질문|ai|AI|챗지피티|gpt/i.test(t)&&/만들|복사/.test(t)){promptCopy();return;}
  if(/고마|감사/.test(t)){addBot("천만에요! 담은 직업을 커리어넷에서 더 찾아보고, 활동지에 옮겨 적어 보세요. 😊");return;}
  if(!search(t)){
    addBot(`'${esc(t)}'에 맞는 직업을 찾지 못했어요. 이렇게 물어봐 주세요.\n· 직업 이름: <b>수의사</b>, <b>웹툰작가</b>\n· 관심 분야: <b>동물, 컴퓨터, 디자인, 음악, 운동, 여행</b>\n· 흥미 유형·능력·가치: <b>예술형</b>, <b>창의력</b>, <b>안정성</b>`);
  }
}
$("send").onclick=onSend;
$("msg").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();onSend();}});
$("bSum").onclick=()=>{addMe("결과 정리해 줘");summary();};
let armReset=false;
$("bReset").onclick=()=>{if(!armReset){armReset=true;$("bReset").textContent="정말 지울까요?";setTimeout(()=>{armReset=false;$("bReset").textContent="↺ 처음부터";},3000);return;}reset();};
function reset(){armReset=false;$("bReset").textContent="↺ 처음부터";S=blank();save();chat.innerHTML="";renderPicks();ask("grade");}

/* ---------- 시작 ---------- */
if(/^https?:$/.test(location.protocol)&&!(window.self!==window.top)){$("bHome").hidden=false;$("bDl").hidden=false;}
load();renderPicks();
if(S.step==="chat"){
  addBot(`다시 만나서 반가워요! 지난번 결과를 이어서 볼게요.\n${profileText()}`);
  showResult();
}else{S.step="grade";S.picks=S.picks||[];ask("grade");}
</script>
</body>
