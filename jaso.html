<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>6-2 자기소개서 준비 · 기본 폼</title>
<style>
:root{--bg:#f4f6fa;--ink:#1d2433;--muted:#5b6478;--line:#dfe3eb;--navy:#17325e;--sel:#eef3ff;--yel:#f4c430;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px;display:grid;gap:14px}
.rain{height:6px;border-radius:3px;background:linear-gradient(90deg,#e53935 0 14.3%,#f57c00 0 28.6%,#f9c80e 0 42.9%,#2e9e48 0 57.1%,#1e7fd8 0 71.4%,#2b3a8c 0 85.7%,#8e3bb0 0)}
h1{margin:0;font-size:clamp(24px,5.5vw,32px);color:var(--navy);font-weight:900;line-height:1.25}
.sub{margin:2px 0 0;color:var(--muted);word-break:keep-all}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--sel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pbtn{font:inherit;font-weight:900;font-size:15.5px;cursor:pointer;border-radius:12px;min-height:46px;padding:6px 18px;border:0;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.pbtn:hover{background:#24467f}
.pbtn.y{background:var(--yel);color:var(--navy)}
.pbtn:disabled{opacity:.55;cursor:default}
.pbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pmsg{font-size:14px;color:var(--muted)}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 6px 24px rgba(23,50,94,.08)}
.sheet img{display:block;width:100%;height:auto;border-radius:4px}
.home{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;font-weight:700;text-decoration:none;border-radius:99px;padding:6px 16px 6px 12px;min-height:44px;justify-self:start}
.pbtn.w{background:#fff;color:var(--navy);border:1.5px solid #b9c7e6}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="./">🏠 홈 · 진로·진학 로드맵</a>
  <div class="rain" aria-hidden="true"></div>
  <div>
    <h1>6-2 자기소개서 준비</h1>
    <p class="sub">STEP 6 실행 준비 · 고입 자기소개서(자기주도학습전형) 기본 폼과 쓰는 순서, 쓰면 안 되는 것을 확인해 보세요.</p>
  </div>
  <div class="pbar">
    <a class="pbtn" href="jaso.pdf" download="고입_자기소개서_기본폼.pdf">🖨️ 기본 폼 PDF 내려받기</a>
  </div>
  <div class="sheet"><img src="jaso.jpg" width="1080" height="1529" alt="고입 자기소개서, 기본 폼으로 준비하기. 01 자기소개서 기본 폼(자기주도학습 과정, 지원 동기·진로 계획, 인성), 02 쓰는 순서, 03 문항별 구조와 작성 팁, 절대 쓰면 안 되는 것, 05 제출 전 셀프 체크가 담겨 있어요."></div>
</div>
</body>
</html>
